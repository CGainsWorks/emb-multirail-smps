name: design

# Budget note. This repository is public, so standard runners cost nothing.
# The workflow is still built lean, because it was private while the design was
# being written, because a free account's private allowance is finite, and
# because a job that wastes four minutes wastes them on every push for ever:
#
#   one job, not four      one checkout and one dependency install, shared by
#                          the tests, the regeneration and the headline guard,
#                          instead of each paying for its own runner
#   path filters           a commit that only touches documentation does not
#                          start a runner at all
#   concurrency            pushing twice in a minute cancels the first run
#                          rather than paying for both
#   pip cache              the dependency install is the second largest cost
#                          after the simulation itself
#   timeout-minutes        a hung job cannot quietly eat the month's allowance
#   manual version matrix  3.9 and 3.11 are checked on demand, not on every
#                          push, because the thing that breaks between versions
#                          is library behaviour and that does not change when
#                          this repository does. 3.12 runs on every push as the
#                          main job's interpreter
#
# Measured at about 2 minutes per push, against roughly 12 for the obvious
# arrangement of one job per check. `make ci` runs the same steps locally.

on:
  push:
    paths:
      - 'simulation/**'
      - 'tests/**'
      - 'scripts/**'
      - 'outputs/**'
      - 'hardware/**'
      - 'test-results/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'simulation/**'
      - 'tests/**'
      - 'scripts/**'
      - 'outputs/**'
      - 'hardware/**'
      - 'test-results/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      python_matrix:
        description: 'Also check the oldest and newest supported Python'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests, regeneration and headline numbers
    # ubuntu-latest rather than a pinned image. A pinned label eventually stops
    # existing, and when it does the job fails before running a step with no
    # useful message, which is a worse failure mode than an image upgrade. The
    # outputs check tolerates platform differences by design, so an image
    # migration is not a problem here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      # No editable install: tests/conftest.py puts simulation/ on the path and
      # run_all.py does the same for itself, so a build step would be a minute
      # spent on nothing.
      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests -q --durations=5

      - name: Regenerate every output
        run: python simulation/run_all.py

      # The numbers in this repository have to be the ones the code produces
      # today. Committed results that have drifted from the code are worse than
      # no results at all, because they look authoritative.
      #
      # Compared as numbers, not as bytes. A switching simulation that locates
      # its switching instants by iteration is not bit reproducible across
      # platforms: the settled outputs agree to about one part per million
      # between Windows with numpy 1.26 and Linux with numpy 2.5, which is
      # three orders finer than any claim made here and four orders finer than
      # the uncertainty in the component values. Insisting on bit equality
      # would fail this job for reasons that have nothing to do with the
      # design. Non-numeric tokens still have to match exactly, so a renamed
      # column, a reordered row or a changed sentence is caught.
      - name: Committed outputs match a fresh run
        run: python scripts/check_outputs_current.py

      # ngspice is free, open source and the simulator inside KiCad. About
      # fifteen seconds of install buys a third independent route to the
      # compensator numbers, from a tool that knows nothing about this
      # repository. The update is only run if the direct install misses.
      - name: Install ngspice
        run: |
          sudo apt-get install -y -qq ngspice             || (sudo apt-get update -qq && sudo apt-get install -y -qq ngspice)
          ngspice -v | head -1

      - name: ngspice agrees with the models
        run: python scripts/run_ngspice.py

      - name: Every plot was produced
        run: |
          missing=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -s "$f" ]; then echo "::error::missing or empty: $f"; missing=1; fi
          done <<'PLOTS'
          test-results/power_tree.png
          test-results/bode/5v_loop_gain.png
          test-results/bode/3v3_loop_gain.png
          test-results/bode/12v_loop_gain.png
          test-results/bode/1v8a_ldo_loop_gain.png
          test-results/bode/1v8a_ldo_psrr.png
          test-results/efficiency/stage_efficiency.png
          test-results/efficiency/system_efficiency.png
          test-results/efficiency/loss_breakdown.png
          test-results/thermal/junction_temperatures.png
          test-results/thermal/ambient_derating.png
          test-results/emc-prescan/conducted_prescan.png
          test-results/emc-prescan/input_filter_middlebrook.png
          test-results/load-regulation/load_regulation.png
          test-results/line-regulation/line_regulation_5v.png
          test-results/transient/5v_load_step.png
          test-results/transient/3v3_load_step.png
          test-results/transient/12v_load_step.png
          PLOTS
          exit $missing

      # The README quotes these. If one stops being true the README is wrong,
      # so the build should fail rather than the README quietly rotting.
      - name: Headline numbers still hold
        run: python scripts/check_headline.py

      # The KiCad schematic, held to the simulation. ERC in the pinned KiCad
      # image with every severity on, then the netlist it exports checked
      # value by value against the ngspice decks, the models and the
      # compensation table. Pulling the image is most of the cost.
      - name: KiCad ERC and the schematic against the simulation
        run: bash scripts/kicad/run_checks.sh

      # Artifacts count against a free account's storage quota, so they are
      # uploaded only when somebody asks for a run by hand and actually wants
      # to look at the results.
      - name: Upload results
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: design-results
          retention-days: 7
          path: |
            outputs/
            test-results/
            docs/spec.md
            docs/validation_report.md
            hardware/kicad/build/

  # Library behaviour across Python versions is what this catches, and that
  # does not change when this repository changes. Run it by hand after a
  # dependency bump, not on every push. Tests only, no regeneration, because
  # the generated outputs are already known to be identical on both ends of
  # the supported range.
  python-versions:
    name: Tests on Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch' && inputs.python_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests -q
